services:
  mysql:
    image: mysql:8.4
    container_name: virtual-enterprise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      CORE_DB_USERNAME: ${CORE_DB_USERNAME:-core_app}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core_app_password}
      WORKLOAD_DB_USERNAME: ${WORKLOAD_DB_USERNAME:-workload_app}
      WORKLOAD_DB_PASSWORD: ${WORKLOAD_DB_PASSWORD:-workload_app_password}
      ML_DB_USERNAME: ${ML_DB_USERNAME:-ml_app}
      ML_DB_PASSWORD: ${ML_DB_PASSWORD:-ml_app_password}
      BACKUP_DB_USERNAME: ${BACKUP_DB_USERNAME:-backup_app}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-backup_app_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 20

  workload-service:
    build:
      context: .
      dockerfile: workload-service/Dockerfile
    container_name: virtual-enterprise-workload
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      WORKLOAD_DB_URL: jdbc:mysql://mysql:3306/enterprise_workload?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${WORKLOAD_DB_USERNAME:-workload_app}
      DB_PASSWORD: ${WORKLOAD_DB_PASSWORD:-workload_app_password}
      WORKLOAD_SERVICE_TOKEN: ${WORKLOAD_SERVICE_TOKEN:-change-me-internal-token}
      WORKLOAD_FEATURE_TIME_ZONE: ${ML_FEATURE_TIME_ZONE:-Europe/Minsk}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh", "8081"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

  enterprise-app:
    build:
      context: .
      dockerfile: enterprise-app/Dockerfile
    container_name: virtual-enterprise-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORE_DB_URL: jdbc:mysql://mysql:3306/enterprise_core?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${CORE_DB_USERNAME:-core_app}
      DB_PASSWORD: ${CORE_DB_PASSWORD:-core_app_password}
      WORKLOAD_SERVICE_URL: http://workload-service:8081
      WORKLOAD_SERVICE_TOKEN: ${WORKLOAD_SERVICE_TOKEN:-change-me-internal-token}
      ML_SERVICE_URL: http://attrition-ml-service:8082
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-change-me-ml-token}
      ML_FEATURE_TIME_ZONE: ${ML_FEATURE_TIME_ZONE:-Europe/Minsk}
      ML_IMPORT_MAX_BYTES: ${ML_IMPORT_MAX_BYTES:-5242880}
      ML_CONNECT_TIMEOUT: ${ML_CONNECT_TIMEOUT:-2s}
      ML_READ_TIMEOUT: ${ML_READ_TIMEOUT:-5s}
      ML_RETRY_ATTEMPTS: ${ML_RETRY_ATTEMPTS:-2}
      ML_RETRY_BACKOFF: ${ML_RETRY_BACKOFF:-100ms}
      ML_PREDICT_BATCH_SIZE: ${ML_PREDICT_BATCH_SIZE:-100}
      ML_PREDICTION_STALE_AFTER: ${ML_PREDICTION_STALE_AFTER:-24h}
      FILE_STORAGE_PATH: /data/files
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh", "8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - file_storage:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      workload-service:
        condition: service_healthy
    networks:
      - backend

  db-bootstrap:
    image: mysql:8.4
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      CORE_DB_USERNAME: ${CORE_DB_USERNAME:-core_app}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core_app_password}
      WORKLOAD_DB_USERNAME: ${WORKLOAD_DB_USERNAME:-workload_app}
      WORKLOAD_DB_PASSWORD: ${WORKLOAD_DB_PASSWORD:-workload_app_password}
      ML_DB_USERNAME: ${ML_DB_USERNAME:-ml_app}
      ML_DB_PASSWORD: ${ML_DB_PASSWORD:-ml_app_password}
      BACKUP_DB_USERNAME: ${BACKUP_DB_USERNAME:-backup_app}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-backup_app_password}
    entrypoint: ["bash", "/bootstrap/03-ensure-service-accounts.sh"]
    volumes:
      - ./mysql-init:/bootstrap:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  ml-migrations:
    build:
      context: .
      dockerfile: attrition-ml-service/db/Dockerfile
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:mysql://mysql:3306/enterprise_ml?allowPublicKeyRetrieval=true&useSSL=false
      LIQUIBASE_COMMAND_USERNAME: ${ML_DB_USERNAME:-ml_app}
      LIQUIBASE_COMMAND_PASSWORD: ${ML_DB_PASSWORD:-ml_app_password}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.xml
    volumes:
      - ./attrition-ml-service/db:/liquibase/changelog:ro
    command: ["--search-path=/liquibase/changelog", "update"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    restart: "no"

  attrition-ml-service:
    build:
      context: .
      dockerfile: attrition-ml-service/Dockerfile
    restart: unless-stopped
    environment:
      ML_DB_HOST: mysql
      ML_DB_PORT: 3306
      DB_USERNAME: ${ML_DB_USERNAME:-ml_app}
      DB_PASSWORD: ${ML_DB_PASSWORD:-ml_app_password}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-change-me-ml-token}
      ML_FEATURE_TIME_ZONE: ${ML_FEATURE_TIME_ZONE:-Europe/Minsk}
      ML_IMPORT_MAX_BYTES: ${ML_IMPORT_MAX_BYTES:-5242880}
      ML_PREDICT_BATCH_SIZE: ${ML_PREDICT_BATCH_SIZE:-100}
      MODEL_STORAGE_PATH: /data/models
    volumes:
      - model_storage:/data/models
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ml-migrations:
        condition: service_completed_successfully
    networks: [backend]

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${BACKUP_DB_USERNAME:-backup_app}
      MYSQL_PASSWORD: ${BACKUP_DB_PASSWORD:-backup_app_password}
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      MODEL_STORAGE_PATH: /data/models
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups
      - model_storage:/data/models:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [backend]

  restore:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    profiles: ["restore"]
    entrypoint: ["/opt/flowstaff/restore.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      BACKUP_ROOT: /backups
      BACKUP_ID: ${BACKUP_ID:-latest}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      MODEL_STORAGE_PATH: /data/models
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups:ro
      - model_storage:/data/models
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

volumes:
  mysql_data:
  file_storage:
  model_storage:

networks:
  backend:
    driver: bridge
