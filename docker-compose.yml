services:
  mysql:
    image: mysql:8.4
    container_name: virtual-enterprise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      DB_USERNAME: ${DB_USERNAME:-virtual_app}
      DB_PASSWORD: ${DB_PASSWORD:-virtual_app_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 20

  workload-service:
    build:
      context: .
      dockerfile: workload-service/Dockerfile
    container_name: virtual-enterprise-workload
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      WORKLOAD_DB_URL: jdbc:mysql://mysql:3306/enterprise_workload?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-virtual_app}
      DB_PASSWORD: ${DB_PASSWORD:-virtual_app_password}
      WORKLOAD_SERVICE_TOKEN: ${WORKLOAD_SERVICE_TOKEN:-change-me-internal-token}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh", "8081"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

  enterprise-app:
    build:
      context: .
      dockerfile: enterprise-app/Dockerfile
    container_name: virtual-enterprise-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORE_DB_URL: jdbc:mysql://mysql:3306/enterprise_core?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-virtual_app}
      DB_PASSWORD: ${DB_PASSWORD:-virtual_app_password}
      WORKLOAD_SERVICE_URL: http://workload-service:8081
      WORKLOAD_SERVICE_TOKEN: ${WORKLOAD_SERVICE_TOKEN:-change-me-internal-token}
      ML_SERVICE_URL: http://attrition-ml-service:8082
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-change-me-ml-token}
      FILE_STORAGE_PATH: /data/files
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh", "8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    ports:
      - "8080:8080"
    volumes:
      - file_storage:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      workload-service:
        condition: service_healthy
    networks:
      - backend

  db-bootstrap:
    image: mysql:8.4
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      DB_USERNAME: ${DB_USERNAME:-virtual_app}
    entrypoint: ["bash", "/bootstrap/02-create-ml-database.sh"]
    volumes:
      - ./mysql-init:/bootstrap:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  ml-migrations:
    image: liquibase/liquibase:4.31.1
    environment:
      INSTALL_MYSQL: "true"
      LIQUIBASE_COMMAND_URL: jdbc:mysql://mysql:3306/enterprise_ml?allowPublicKeyRetrieval=true&useSSL=false
      LIQUIBASE_COMMAND_USERNAME: ${DB_USERNAME:-virtual_app}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-virtual_app_password}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.xml
    volumes:
      - ./attrition-ml-service/db:/liquibase/changelog:ro
    command: ["--search-path=/liquibase/changelog", "update"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    restart: "no"

  attrition-ml-service:
    build:
      context: .
      dockerfile: attrition-ml-service/Dockerfile
    restart: unless-stopped
    environment:
      ML_DB_HOST: mysql
      ML_DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-virtual_app}
      DB_PASSWORD: ${DB_PASSWORD:-virtual_app_password}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-change-me-ml-token}
      MODEL_STORAGE_PATH: /data/models
    volumes:
      - model_storage:/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8082/internal/v1/health',headers={'X-Service-Token':os.environ['ML_SERVICE_TOKEN']}),timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ml-migrations:
        condition: service_completed_successfully
    networks: [backend]

volumes:
  mysql_data:
  file_storage:
  model_storage:

networks:
  backend:
    driver: bridge
