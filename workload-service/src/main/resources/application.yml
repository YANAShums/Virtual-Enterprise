server:
  port: 8081

spring:
  application:
    name: workload-service
  datasource:
    url: ${WORKLOAD_DB_URL:jdbc:mysql://localhost:3307/enterprise_workload?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:workload_app}
    password: ${DB_PASSWORD:workload_app_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

workload:
  service-token: ${WORKLOAD_SERVICE_TOKEN:change-me-internal-token}
