<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Отсутствие сотрудника')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main id="mainContent" class="container form-page"><a class="eyebrow d-inline-flex align-items-center mb-3" th:href="@{/employees/{id}(id=${employee.id})}"><i data-lucide="arrow-left" class="me-2" aria-hidden="true"></i>Карточка сотрудника</a>
<div class="page-heading"><div><p class="eyebrow">ОТСУТСТВИЯ</p><h1 th:text="${recordId == null ? 'Новое отсутствие' : 'Редактирование отсутствия'}"></h1><p class="page-subtitle" th:text="${employee.fullName}"></p></div></div>
<form class="employee-form" th:action="${recordId == null} ? @{/employees/{employeeId}/absences(employeeId=${employee.id})} : @{/employees/{employeeId}/absences/{id}(employeeId=${employee.id},id=${recordId})}" th:object="${absenceForm}" method="post">
<input th:if="${recordId != null}" type="hidden" th:field="*{version}"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><ul class="mb-0"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<section class="form-section"><div class="form-section-heading"><span class="form-section-icon"><i data-lucide="calendar-off" aria-hidden="true"></i></span><div><h2>Период отсутствия</h2><p>Подтверждённые пересекающиеся периоды не допускаются.</p></div></div><div class="row g-3">
<div class="col-md-4"><label class="form-label" for="absenceType">Тип *</label><select id="absenceType" th:field="*{absenceType}" class="form-select"><option value="VACATION">Отпуск</option><option value="SICK_LEAVE">Больничный</option><option value="BUSINESS_TRIP">Командировка</option><option value="UNPAID_LEAVE">Отпуск без оплаты</option><option value="OTHER">Другое</option></select></div>
<div class="col-md-4"><label class="form-label" for="status">Статус *</label><select id="status" th:field="*{status}" class="form-select"><option value="REQUESTED">На рассмотрении</option><option value="APPROVED">Подтверждено</option><option value="REJECTED">Отклонено</option><option value="CANCELLED">Отменено</option></select></div>
<div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input id="allDay" th:field="*{allDay}" type="checkbox" class="form-check-input"><label class="form-check-label" for="allDay">Весь день</label></div></div>
<div class="col-md-6"><label class="form-label" for="startAt">Начало *</label><input id="startAt" th:field="*{startAt}" type="datetime-local" class="form-control" required></div>
<div class="col-md-6"><label class="form-label" for="endAt">Окончание *</label><input id="endAt" th:field="*{endAt}" type="datetime-local" class="form-control" required></div>
<div class="col-12"><label class="form-label" for="reason">Основание</label><textarea id="reason" th:field="*{reason}" class="form-control" maxlength="500" rows="3"></textarea></div>
</div></section><div class="form-actions"><button class="btn btn-primary"><i data-lucide="save" class="me-2" aria-hidden="true"></i>Сохранить</button><a class="btn btn-outline-secondary" th:href="@{/employees/{id}(id=${employee.id})}">Отмена</a></div></form></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
