<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Редактирование проекта' : 'Новый проект'})}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main id="mainContent" class="container form-page"><a class="eyebrow d-inline-flex align-items-center mb-3" th:href="${editing ? '/projects/'+projectId : '/projects'}"><i data-lucide="arrow-left" class="me-2" aria-hidden="true"></i>Проекты</a>
<div class="page-heading"><div><p class="eyebrow">ПРОЕКТНАЯ РАБОТА</p><h1 th:text="${editing ? 'Редактирование проекта' : 'Новый проект'}"></h1><p class="page-subtitle">Параметры, команда и текущее состояние проекта.</p></div></div>
<form class="employee-form" th:action="${editing} ? @{/projects/{id}(id=${projectId})} : @{/projects}" th:object="${projectForm}" method="post">
<input th:if="${editing}" type="hidden" th:field="*{version}"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><ul class="mb-0"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<section class="form-section"><div class="form-section-heading"><span class="form-section-icon"><i data-lucide="folder-kanban" aria-hidden="true"></i></span><div><h2>Основные данные</h2><p>Код используется в номерах задач проекта.</p></div></div><div class="row g-3">
<div class="col-md-3"><label class="form-label" for="code">Код *</label><input id="code" th:field="*{code}" class="form-control text-uppercase" maxlength="50" required></div><div class="col-md-9"><label class="form-label" for="name">Название *</label><input id="name" th:field="*{name}" class="form-control" maxlength="255" required></div>
<div class="col-12"><label class="form-label" for="description">Описание</label><textarea id="description" th:field="*{description}" class="form-control" rows="3" maxlength="10000"></textarea></div>
<div class="col-md-4"><label class="form-label" for="managerId">Руководитель *</label><select id="managerId" th:field="*{managerId}" class="form-select" required><option value="">Выберите</option><option th:each="x:${employees}" th:value="${x.id}" th:text="${x.fullName}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="plannedStartDate">Начало *</label><input id="plannedStartDate" th:field="*{plannedStartDate}" type="date" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="plannedEndDate">Окончание *</label><input id="plannedEndDate" th:field="*{plannedEndDate}" type="date" class="form-control" required></div>
<div class="col-md-3"><label class="form-label" for="plannedHours">Плановые часы</label><input id="plannedHours" th:field="*{plannedHours}" type="number" min="0" step="1" class="form-control"></div><div class="col-md-3"><label class="form-label" for="priority">Приоритет</label><select id="priority" th:field="*{priority}" class="form-select"><option value="LOW">Низкий</option><option value="MEDIUM">Средний</option><option value="HIGH">Высокий</option><option value="CRITICAL">Критический</option></select></div>
<div class="col-md-3"><label class="form-label" for="status">Статус</label><select id="status" th:field="*{status}" class="form-select"><option value="PLANNED">Запланирован</option><option value="ACTIVE">Активный</option><option value="PAUSED">Приостановлен</option><option value="COMPLETED">Завершён</option><option value="CANCELLED">Отменён</option></select></div><div class="col-md-3"><label class="form-label" for="riskLevel">Риск</label><select id="riskLevel" th:field="*{riskLevel}" class="form-select"><option value="LOW">Низкий</option><option value="MEDIUM">Средний</option><option value="HIGH">Высокий</option></select></div>
<div class="col-md-4"><label class="form-label" for="progressPercent">Готовность, %</label><input id="progressPercent" th:field="*{progressPercent}" type="number" min="0" max="100" step="1" class="form-control"></div>
</div></section>
<section class="form-section"><div class="form-section-heading"><span class="form-section-icon"><i data-lucide="users-round" aria-hidden="true"></i></span><div><h2>Команда проекта</h2><p>Руководитель будет добавлен автоматически.</p></div></div><div class="search-field mb-3"><i data-lucide="search" aria-hidden="true"></i><input type="search" class="form-control" data-filter-target=".team-choice" placeholder="Найти сотрудника" aria-label="Поиск участника команды"></div><div class="team-choices"><label class="team-choice" th:each="x:${employees}"><input type="checkbox" class="form-check-input m-0" th:field="*{memberIds}" th:value="${x.id}"><span><span th:text="${x.fullName}"></span><small class="d-block text-secondary" th:text="${x.position.name+' · '+x.department.name}"></small></span></label></div></section>
<div class="form-actions"><button class="btn btn-primary"><i data-lucide="save" class="me-2" aria-hidden="true"></i><span th:text="${editing ? 'Сохранить изменения' : 'Создать проект'}"></span></button><a class="btn btn-outline-secondary" th:href="${editing ? '/projects/'+projectId : '/projects'}">Отмена</a></div></form></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
