<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Проекты')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main id="mainContent" class="container-fluid">
 <div class="page-heading"><div><p class="eyebrow">РАБОТА КОМАНДЫ</p><h1>Проекты</h1><p class="page-subtitle">Сроки, прогресс и ответственные в одном пространстве.</p></div><a th:if="${@accessScopeService.canCreateProject()}" th:href="@{/projects/new}" class="btn btn-primary"><i data-lucide="plus" class="me-2" aria-hidden="true"></i>Создать проект</a></div>
 <div class="view-tabs"><a class="active" th:href="@{/projects}" aria-current="page">Все проекты <span class="text-secondary ms-1" th:text="${#lists.size(projects)}"></span></a></div>
 <div th:replace="~{fragments/ui :: flash}"></div>
 <div class="toolbar"><div class="search-field"><i data-lucide="search" class="" aria-hidden="true"></i><input type="search" class="form-control" data-filter-target=".project-item" placeholder="Название, код или руководитель" aria-label="Поиск проекта"></div></div>
 <div class="table-responsive"><table class="table table-hover align-middle projects-table"><thead><tr><th>Название</th><th>Статус</th><th>Руководитель</th><th>Срок завершения</th><th>Прогресс</th><th>Риск</th><th>Доска</th></tr></thead><tbody>
  <tr class="project-item" th:each="project:${projects}"><td><div class="project-title"><span class="project-mark" th:text="${#strings.substring(project.code,0,T(java.lang.Math).min(2,project.code.length()))}"></span><div><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a><div class="small text-secondary mt-1" th:text="${project.code}"></div></div></div></td><td><span th:replace="~{fragments/ui :: projectStatus(${project.status})}"></span></td><td th:text="${project.manager != null ? project.manager.fullName : 'Не назначен'}"></td><td th:text="${#temporals.format(project.plannedEndDate,'dd.MM.yyyy')}"></td><td><div class="project-progress"><span th:text="${project.progressPercent+'%'}"></span><div class="progress"><div class="progress-bar" th:style="${'width:'+project.progressPercent+'%'}"></div></div></div></td><td><span th:replace="~{fragments/ui :: risk(${project.riskLevel})}"></span></td><td><a class="btn btn-ghost btn-icon" th:href="@{/kanban(projectId=${project.id})}" th:aria-label="${'Доска проекта '+project.name}" title="Открыть доску"><i data-lucide="columns-3" class="" aria-hidden="true"></i></a></td></tr>
  <tr th:if="${#lists.isEmpty(projects)}"><td colspan="7"><div th:replace="~{fragments/ui :: empty('Проектов пока нет', 'Создайте проект, чтобы начать работу.')}"></div></td></tr><tr data-filter-empty hidden><td colspan="7" class="empty-state">Проекты не найдены. Измените поисковый запрос.</td></tr>
 </tbody></table></div>
</main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
