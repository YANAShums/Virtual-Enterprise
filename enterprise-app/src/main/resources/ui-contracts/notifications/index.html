<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Уведомления')}"></head>
<body><div th:replace="~{fragments/layout :: navbar}"></div>
<main id="mainContent" class="container-fluid management-page">
    <div class="page-heading"><div><p class="eyebrow">ЦЕНТР СОБЫТИЙ</p><h1>Уведомления</h1><p class="page-subtitle">Критическая загрузка и значимые изменения кадрового риска.</p></div>
        <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post"><button class="btn btn-outline-secondary"><i data-lucide="check-check" aria-hidden="true"></i>Прочитать все</button></form></div>
    <section class="notification-list" th:if="${!#lists.isEmpty(notifications)}">
        <article th:each="item:${notifications}" class="notification-card" th:classappend="${!item.read ? 'is-unread' : ''}">
            <span class="notification-icon"><i th:attr="data-lucide=${item.type == 'CRITICAL_OVERLOAD' ? 'gauge' : 'shield-alert'}" aria-hidden="true"></i></span>
            <div><div class="notification-heading"><h2 th:text="${item.title}"></h2><time th:text="${#temporals.format(item.createdAt,'dd.MM.yyyy HH:mm')}"></time></div><p th:text="${item.message}"></p>
                <a th:if="${item.entityType == 'EMPLOYEE'}" th:href="|/employees/${item.entityId}#employeeAttrition|">Открыть сотрудника <i data-lucide="arrow-right" aria-hidden="true"></i></a>
                <a th:if="${item.entityType == 'TASK'}" th:href="@{/tasks/{id}(id=${item.entityId})}">Открыть задачу <i data-lucide="arrow-right" aria-hidden="true"></i></a></div>
            <form th:if="${!item.read}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post"><button class="btn btn-ghost btn-icon" aria-label="Отметить прочитанным"><i data-lucide="check" aria-hidden="true"></i></button></form>
        </article>
    </section>
    <div th:if="${#lists.isEmpty(notifications)}" class="empty-state widget"><span class="empty-icon"><i data-lucide="bell-off" aria-hidden="true"></i></span><h2>Новых событий нет</h2><p>Здесь появятся уведомления о критической перегрузке и росте риска текучести.</p></div>
</main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
