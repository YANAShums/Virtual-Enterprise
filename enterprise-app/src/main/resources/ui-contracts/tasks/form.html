<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Редактирование задачи')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main id="mainContent" class="container form-page"><a class="eyebrow d-inline-flex align-items-center mb-3" th:href="@{/tasks/{id}(id=${taskId})}"><i data-lucide="arrow-left" class="me-2" aria-hidden="true"></i>Карточка задачи</a>
<div class="page-heading"><div><p class="eyebrow">ПЛАНИРОВАНИЕ</p><h1>Редактирование задачи</h1><p class="page-subtitle">Изменения исполнителя, сроков и оценки будут записаны в аудит.</p></div></div>
<form class="employee-form" th:action="@{/tasks/{id}(id=${taskId})}" th:object="${taskForm}" method="post"><input type="hidden" th:field="*{version}"><input type="hidden" th:field="*{projectId}">
<div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><ul class="mb-0"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<section class="form-section"><div class="form-section-heading"><span class="form-section-icon"><i data-lucide="square-pen" aria-hidden="true"></i></span><div><h2>Параметры задачи</h2><p>Статус изменяется отдельно на карточке или Kanban-доске.</p></div></div><div class="row g-3">
<div class="col-12"><label class="form-label" for="title">Название *</label><input id="title" th:field="*{title}" class="form-control" minlength="3" maxlength="255" required></div>
<div class="col-12"><label class="form-label" for="description">Описание</label><textarea id="description" th:field="*{description}" class="form-control" maxlength="10000" rows="4"></textarea></div>
<div class="col-md-6"><label class="form-label" for="assigneeEmployeeId">Исполнитель *</label><select id="assigneeEmployeeId" th:field="*{assigneeEmployeeId}" class="form-select" required><option th:each="m:${assignees}" th:value="${m.id}" th:text="${m.fullName+' · '+m.position.name}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="priorityCode">Приоритет *</label><select id="priorityCode" th:field="*{priorityCode}" class="form-select"><option th:each="p:${priorities}" th:value="${p.code}" th:text="${p.name}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="plannedStartDate">Начало</label><input id="plannedStartDate" th:field="*{plannedStartDate}" type="date" class="form-control"></div>
<div class="col-md-4"><label class="form-label" for="plannedEndDate">Дедлайн *</label><input id="plannedEndDate" th:field="*{plannedEndDate}" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label" for="plannedHours">Оценка, ч *</label><input id="plannedHours" th:field="*{plannedHours}" type="number" min="0.25" max="10000" step="0.25" class="form-control" required></div>
</div></section><div class="form-actions"><button class="btn btn-primary"><i data-lucide="save" class="me-2" aria-hidden="true"></i>Сохранить изменения</button><a class="btn btn-outline-secondary" th:href="@{/tasks/{id}(id=${taskId})}">Отмена</a></div></form></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
