<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Администрирование')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main id="mainContent" tabindex="-1" class="container form-page py-4">
<div class="card"><div class="card-body p-4"><h1 th:text="${section == 'users' ? 'Архивировать пользователя?' : 'Удалить запись?'}"></h1><p th:text="${section == 'calendar' ? form.calendarDate : section == 'users' ? form.username : form.name}"></p><p th:text="${section == 'users' ? 'Вход будет запрещён, действующие сессии будут отозваны. История действий сохранится.' : 'Удаление необратимо. Если запись используется, система предложит сохранить её в архиве.'}"></p><form method="post" th:action="@{'/admin/' + ${section} + '/' + ${recordId} + '/delete'}"><input type="hidden" name="version" th:value="${form.version}"><button class="btn btn-danger" th:text="${section == 'users' ? 'Архивировать' : 'Удалить'}"></button><a class="btn btn-outline-secondary ms-2" th:href="@{/admin(section=${section})}">Отмена</a></form></div></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
