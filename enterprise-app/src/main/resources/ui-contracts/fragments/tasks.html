<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="table(tasks)" class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Задача</th><th>Исполнитель</th><th>Статус</th><th>Дедлайн</th><th>План, ч</th></tr></thead><tbody>
 <tr th:each="task:${tasks}"><td style="min-width:240px"><a th:href="@{/tasks/{id}(id=${task.id})}" class="task-number" th:text="${task.taskNumber}"></a><a th:href="@{/tasks/{id}(id=${task.id})}" class="task-title-link" th:text="${task.title}"></a></td><td th:text="${task.assignee != null ? task.assignee.fullName : 'Не назначен'}"></td><td><span class="status-pill" th:data-status="${task.status.code}" th:data-actual-hours="${task.actualHours}" th:text="${task.status.name}"></span></td><td class="text-nowrap" th:classappend="${task.overdue} ? 'text-danger'" th:text="${#temporals.format(task.plannedEndDate,'dd.MM.yyyy')}"></td><td th:text="${task.plannedHours}"></td></tr>
 <tr th:if="${#lists.isEmpty(tasks)}"><td colspan="5"><div th:replace="~{fragments/ui :: empty('Задачи не найдены', 'Измените фильтры или создайте новую задачу.')}"></div></td></tr>
</tbody></table></div></body></html>
