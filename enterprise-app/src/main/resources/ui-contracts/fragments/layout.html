<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
 <title th:text="${title} + ' — FlowStaff AI'">FlowStaff AI</title>



</head><body>
<div th:fragment="navbar">
 <a class="skip-link" href="#mainContent">Перейти к содержимому</a>
 <aside class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar" aria-label="Основное меню">
  <div class="sidebar-head"><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Развернуть меню" title="Развернуть меню" aria-expanded="false"><i data-lucide="panel-left" class="" aria-hidden="true"></i></button><a class="app-brand" th:href="@{/dashboard}"><img th:src="@{/css/images/flowstaff-mark.png}" alt=""><span>FlowStaff AI<small>Люди. Задачи. Рост.</small></span></a></div>
  <a class="rail-create" th:href="@{/kanban(create=1)}" title="Создать задачу" aria-label="Создать задачу" sec:authorize="hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER','PROJECT_MANAGER')"><i data-lucide="plus" class="" aria-hidden="true"></i><span class="nav-label">Создать задачу</span></a>
  <nav class="app-nav" aria-label="Основная навигация">
   <a th:href="@{/dashboard}" title="Главная" aria-label="Главная"><i data-lucide="house" class="" aria-hidden="true"></i><span class="nav-label">Главная</span></a>
   <a th:href="@{/tasks}" title="Задачи" aria-label="Задачи"><i data-lucide="list-checks" class="" aria-hidden="true"></i><span class="nav-label">Задачи</span></a>
   <a th:href="@{/projects}" title="Проекты" aria-label="Проекты"><i data-lucide="folder" class="" aria-hidden="true"></i><span class="nav-label">Проекты</span></a>
   <a th:href="@{/kanban}" title="Доски" aria-label="Доски"><i data-lucide="columns-3" class="" aria-hidden="true"></i><span class="nav-label">Доски</span></a>
   <a th:href="@{/employees}" title="Сотрудники" aria-label="Сотрудники"><i data-lucide="users" class="" aria-hidden="true"></i><span class="nav-label">Команда</span></a>
   <a th:href="@{/workload}" title="Загруженность" aria-label="Загруженность"><i data-lucide="chart-no-axes-combined" class="" aria-hidden="true"></i><span class="nav-label">Аналитика</span></a>
   <a sec:authorize="hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER')" th:href="@{/attrition}" title="Прогнозы текучести" aria-label="Прогнозы текучести"><i data-lucide="shield-check" aria-hidden="true"></i><span class="nav-label">Текучесть</span></a>
   <a sec:authorize="hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER')" th:href="@{/reports}" title="Отчёты" aria-label="Отчёты"><i data-lucide="file-chart-column" aria-hidden="true"></i><span class="nav-label">Отчёты</span></a>
  </nav>
  <nav class="app-nav admin-nav" sec:authorize="hasRole('ADMIN')" aria-label="Управление"><a th:href="@{/admin}" title="Администрирование" aria-label="Администрирование"><i data-lucide="settings" class="" aria-hidden="true"></i><span class="nav-label">Администрирование</span></a></nav>
  <div class="sidebar-footer"><span class="avatar"><i data-lucide="user-round" class="" aria-hidden="true"></i></span><div class="profile-copy"><strong sec:authentication="name"></strong><div class="small text-secondary">FlowStaff AI</div></div></div>
 </aside>
 <header class="app-topbar">
  <div class="d-flex align-items-center gap-3"><button class="btn btn-ghost btn-icon menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Открыть меню"><i data-lucide="panel-left" class="" aria-hidden="true"></i></button><nav aria-label="Хлебные крошки"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/dashboard}" aria-label="Моя страница"><i data-lucide="house" class="" aria-hidden="true"></i></a></li><li class="breadcrumb-item active" aria-current="page" id="currentBreadcrumb">Рабочее пространство</li></ol></nav></div>
  <div class="topbar-actions"><form class="topbar-search search-field" method="get" th:action="@{/tasks}" role="search"><i data-lucide="search" class="" aria-hidden="true"></i><input class="form-control" type="search" name="q" id="globalSearch" placeholder="Поиск сотрудников, задач, проектов…" aria-label="Поиск по всем задачам"><kbd class="search-shortcut" aria-hidden="true">Ctrl K</kbd></form><a class="topbar-period" th:if="${periodStart != null}" th:href="@{/workload(start=${periodStart},end=${periodEnd})}"><i data-lucide="calendar-days" aria-hidden="true"></i><span><span th:text="${#temporals.format(periodStart,'dd.MM')}"></span> — <span th:text="${#temporals.format(periodEnd,'dd.MM')}"></span></span><i data-lucide="chevron-down" aria-hidden="true"></i></a><a sec:authorize="hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER')" class="topbar-notifications" th:href="@{/notifications}" aria-label="Уведомления"><i data-lucide="bell" aria-hidden="true"></i><span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" class="notification-count" th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}"></span></a><div class="dropdown"><button class="account-button" data-bs-toggle="dropdown" type="button" aria-label="Меню аккаунта" aria-expanded="false"><span class="avatar"><i data-lucide="user-round" class="" aria-hidden="true"></i></span><span class="account-copy"><strong sec:authentication="name"></strong><small sec:authorize="hasRole('ADMIN')">Администратор</small><small sec:authorize="!hasRole('ADMIN') and hasAnyRole('ENTERPRISE_MANAGER','DEPARTMENT_MANAGER','PROJECT_MANAGER')">Руководитель</small><small sec:authorize="hasRole('EMPLOYEE') and !hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER','PROJECT_MANAGER')">Сотрудник</small></span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="dropdown-menu dropdown-menu-end"><div class="px-3 py-2"><strong sec:authentication="name"></strong><div class="small text-secondary">FlowStaff AI</div></div><hr class="dropdown-divider"><form th:action="@{/logout}" method="post"><button class="dropdown-item"><i data-lucide="log-out" class="me-2" aria-hidden="true"></i>Выйти из аккаунта</button></form></div></div></div>
 </header>
</div>
<div th:fragment="scripts"></div>
</body></html>
