<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${task.taskNumber})}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main id="mainContent" class="container-fluid">
<div class="d-flex align-items-center gap-2 mb-4 small"><a th:href="@{/tasks(projectId=${task.project.id})}" th:text="${task.project.name}"></a><i class="bi bi-chevron-right text-secondary" aria-hidden="true"></i><span class="text-secondary" th:text="${task.taskNumber}"></span></div>
<div class="page-heading"><h1 th:text="${task.title}"></h1><a class="btn btn-outline-secondary" th:href="@{/kanban(projectId=${task.project.id})}"><i class="bi bi-layout-three-columns me-2" aria-hidden="true"></i>На доске</a></div>
<div id="boardAlert" role="status" aria-live="polite"></div>
<div class="detail-layout"><div class="detail-content">
<div class="d-flex align-items-center gap-3 mb-4" data-task-record th:data-task-id="${task.id}" th:data-version="${task.version}" th:data-status="${task.status.code}">
<label class="visually-hidden" for="detailStatus">Изменить статус задачи</label><select id="detailStatus" class="form-select task-status-select" style="max-width:200px" aria-label="Изменить статус задачи" th:disabled="${!#authorization.expression('hasAnyRole(''ADMIN'',''ENTERPRISE_MANAGER'',''DEPARTMENT_MANAGER'',''PROJECT_MANAGER'')') and (task.assignee == null or task.assignee.user == null or task.assignee.user.username != #authentication.name)}"><option th:each="s:${statuses}" th:value="${s.code}" th:selected="${s.code == task.status.code}" th:text="${s.name}"></option></select>
<span class="small text-danger task-overdue-notice" th:if="${task.overdue}"><i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>Срок задачи истёк</span>
</div>
<section class="detail-section"><h2>Описание</h2><p class="description-text" th:text="${!#strings.isEmpty(task.description) ? task.description : 'Описание пока не добавлено.'}"></p></section>
<section class="detail-section"><h2>Планирование</h2><dl class="detail-list"><dt>Начало</dt><dd th:text="${task.plannedStartDate != null ? #temporals.format(task.plannedStartDate,'dd.MM.yyyy') : 'Не задано'}"></dd><dt>Дедлайн</dt><dd th:text="${#temporals.format(task.plannedEndDate,'dd.MM.yyyy')}"></dd><dt>Оценка</dt><dd th:text="${task.plannedHours+' ч'}"></dd><dt>Затрачено</dt><dd th:text="${task.actualHours+' ч'}"></dd></dl></section>
</div><aside class="property-panel"><h2>Параметры задачи</h2><dl class="property-list"><dt>Статус</dt><dd><span class="status-pill" id="detailStatusBadge" th:data-status="${task.status.code}" th:text="${task.status.name}"></span></dd><dt>Приоритет</dt><dd th:text="${task.priority.name}"></dd><dt>Исполнитель</dt><dd><a th:if="${task.assignee != null}" th:href="@{/employees/{id}(id=${task.assignee.id})}" th:text="${task.assignee.fullName}"></a><span th:if="${task.assignee == null}">Не назначен</span></dd><dt>Автор</dt><dd th:text="${task.creator.username}"></dd><dt>Проект</dt><dd><a th:href="@{/projects/{id}(id=${task.project.id})}" th:text="${task.project.name}"></a></dd><dt>Ключ</dt><dd th:text="${task.taskNumber}"></dd></dl></aside></div>
</main><div th:replace="~{fragments/layout :: scripts}"></div><script th:src="@{/js/task-status.js}"></script></body></html>
