<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body class="login-page">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card login-card shadow-lg border-0">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="login-icon"><i aria-hidden="true" class="bi bi-check2-square"></i></div>
                <h1 class="h3 mt-3">Virtual Enterprise</h1>
                <p class="text-secondary">Вход в рабочее пространство</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль.</div>
            <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3"><label class="form-label" for="username">Логин</label><input id="username" name="username" class="form-control form-control-lg" required autofocus autocomplete="username" placeholder="Введите логин"></div>
                <div class="mb-4"><label class="form-label" for="password">Пароль</label><input id="password" name="password" type="password" class="form-control form-control-lg" required autocomplete="current-password" placeholder="Введите пароль"></div>
                <button class="btn btn-primary btn-lg w-100">Войти</button>
            </form>

        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div></body>
</html>
