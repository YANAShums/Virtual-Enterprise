<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Новый сотрудник')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="mainContent" tabindex="-1" class="container form-page"><div class="mb-4"><a th:href="@{/employees}" class="text-decoration-none"><i data-lucide="arrow-left" class="me-2" aria-hidden="true"></i>К списку</a><h1 class="h3 mt-4 mb-4">Добавление сотрудника</h1></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/employees}" th:object="${employeeForm}" method="post" class="row g-3"><div class="col-12" th:if="${#fields.hasAnyErrors()}"><div class="alert alert-danger" role="alert"><strong>Проверьте заполнение формы</strong><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div></div>
<div class="col-md-4"><label class="form-label" for="personnelNumber">Табельный номер *</label><input id="personnelNumber" th:field="*{personnelNumber}" class="form-control" th:classappend="${#fields.hasErrors('personnelNumber')}?'is-invalid'" required><div class="invalid-feedback" th:errors="*{personnelNumber}"></div></div>
<div class="col-md-4"><label class="form-label" for="lastName">Фамилия *</label><input id="lastName" th:field="*{lastName}" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="firstName">Имя *</label><input id="firstName" th:field="*{firstName}" class="form-control" required></div>
<div class="col-md-4"><label class="form-label" for="middleName">Отчество</label><input id="middleName" th:field="*{middleName}" class="form-control"></div><div class="col-md-4"><label class="form-label" for="email">Email</label><input id="email" th:field="*{email}" type="email" class="form-control"></div><div class="col-md-4"><label class="form-label" for="hireDate">Дата приёма *</label><input id="hireDate" th:field="*{hireDate}" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label" for="departmentId">Подразделение *</label><select id="departmentId" th:field="*{departmentId}" class="form-select" required><option value="">Выберите</option><option th:each="x:${departments}" th:value="${x.id}" th:text="${x.name}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="positionId">Должность *</label><select id="positionId" th:field="*{positionId}" class="form-select" required><option value="">Выберите</option><option th:each="x:${positions}" th:value="${x.id}" th:text="${x.name}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="managerId">Руководитель</label><select id="managerId" th:field="*{managerId}" class="form-select"><option value="">Не назначен</option><option th:each="x:${managers}" th:value="${x.id}" th:text="${x.fullName}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="workScheduleId">Рабочий график *</label><select id="workScheduleId" th:field="*{workScheduleId}" class="form-select" required><option th:each="x:${schedules}" th:value="${x.id}" th:text="${x.name}"></option></select></div><div class="col-md-3"><label class="form-label" for="employmentRate">Ставка *</label><input id="employmentRate" th:field="*{employmentRate}" type="number" min="0.1" max="1" step="0.05" class="form-control" required></div>
<div class="col-12 form-actions"><button class="btn btn-primary">Сохранить сотрудника</button><a th:href="@{/employees}" class="btn btn-outline-secondary ms-2">Отмена</a></div></form></div></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
