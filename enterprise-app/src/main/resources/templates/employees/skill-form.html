<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Навык сотрудника')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main id="mainContent" class="container form-page"><a class="eyebrow d-inline-flex align-items-center mb-3" th:href="@{/employees/{id}(id=${employee.id})}"><i data-lucide="arrow-left" class="me-2" aria-hidden="true"></i>Карточка сотрудника</a>
<div class="page-heading"><div><p class="eyebrow">КОМПЕТЕНЦИИ</p><h1 th:text="${recordId == null ? 'Новый навык' : 'Редактирование навыка'}"></h1><p class="page-subtitle" th:text="${employee.fullName}"></p></div></div>
<form class="employee-form" th:action="${recordId == null} ? @{/employees/{employeeId}/skills(employeeId=${employee.id})} : @{/employees/{employeeId}/skills/{id}(employeeId=${employee.id},id=${recordId})}" th:object="${skillForm}" method="post">
<input th:if="${recordId != null}" type="hidden" th:field="*{version}"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><ul class="mb-0"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<section class="form-section"><div class="form-section-heading"><span class="form-section-icon"><i data-lucide="badge-check" aria-hidden="true"></i></span><div><h2>Компетенция</h2><p>Уровень используется для последующего подбора исполнителей.</p></div></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="skillName">Название навыка *</label><input id="skillName" th:field="*{skillName}" class="form-control" maxlength="120" required placeholder="Например, Java"></div>
<div class="col-md-6"><label class="form-label" for="proficiencyLevel">Уровень *</label><select id="proficiencyLevel" th:field="*{proficiencyLevel}" class="form-select"><option value="1">1 — начальный</option><option value="2">2 — базовый</option><option value="3">3 — уверенный</option><option value="4">4 — продвинутый</option><option value="5">5 — экспертный</option></select></div>
<div class="col-md-6"><label class="form-label" for="yearsExperience">Опыт, лет</label><input id="yearsExperience" th:field="*{yearsExperience}" type="number" min="0" max="99" step="0.5" class="form-control"></div>
<div class="col-md-6"><label class="form-label" for="lastUsedDate">Последнее использование</label><input id="lastUsedDate" th:field="*{lastUsedDate}" type="date" class="form-control"></div>
</div></section><div class="form-actions"><button class="btn btn-primary"><i data-lucide="save" class="me-2" aria-hidden="true"></i>Сохранить</button><a class="btn btn-outline-secondary" th:href="@{/employees/{id}(id=${employee.id})}">Отмена</a></div></form></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
