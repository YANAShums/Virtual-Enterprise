<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
 <title th:text="${title} + ' — Virtual Enterprise'">Virtual Enterprise</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 <link rel="icon" href="data:,"><link th:href="@{/css/app.css}" rel="stylesheet">
</head><body>
<div th:fragment="navbar">
 <a class="skip-link" href="#mainContent">Перейти к содержимому</a>
 <aside class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar" aria-label="Основное меню">
  <div class="sidebar-head"><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Развернуть меню" title="Развернуть меню" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button><a class="app-brand" th:href="@{/dashboard}">Enterprise</a></div>
  <a class="rail-create" th:href="@{/kanban(create=1)}" title="Создать задачу" aria-label="Создать задачу" sec:authorize="hasAnyRole('ADMIN','ENTERPRISE_MANAGER','DEPARTMENT_MANAGER','PROJECT_MANAGER')"><i class="bi bi-plus-lg" aria-hidden="true"></i><span class="nav-label">Создать задачу</span></a>
  <nav class="app-nav" aria-label="Основная навигация">
   <a th:href="@{/dashboard}" title="Моя страница" aria-label="Моя страница"><i class="bi bi-house-door" aria-hidden="true"></i><span class="nav-label">Моя страница</span></a>
   <a th:href="@{/tasks}" title="Задачи" aria-label="Задачи"><i class="bi bi-list-check" aria-hidden="true"></i><span class="nav-label">Задачи</span></a>
   <a th:href="@{/projects}" title="Проекты" aria-label="Проекты"><i class="bi bi-folder2" aria-hidden="true"></i><span class="nav-label">Проекты</span></a>
   <a th:href="@{/kanban}" title="Доски" aria-label="Доски"><i class="bi bi-layout-three-columns" aria-hidden="true"></i><span class="nav-label">Доски</span></a>
   <a th:href="@{/employees}" title="Сотрудники" aria-label="Сотрудники"><i class="bi bi-people" aria-hidden="true"></i><span class="nav-label">Сотрудники</span></a>
   <a th:href="@{/workload}" title="Загруженность" aria-label="Загруженность"><i class="bi bi-bar-chart-line" aria-hidden="true"></i><span class="nav-label">Загруженность</span></a>
  </nav>
  <nav class="app-nav admin-nav" sec:authorize="hasRole('ADMIN')" aria-label="Управление"><a th:href="@{/admin}" title="Администрирование" aria-label="Администрирование"><i class="bi bi-gear" aria-hidden="true"></i><span class="nav-label">Администрирование</span></a></nav>
  <div class="sidebar-footer"><span class="avatar"><i class="bi bi-person" aria-hidden="true"></i></span><div class="profile-copy"><strong sec:authentication="name"></strong><div class="small text-secondary">Virtual Enterprise</div></div></div>
 </aside>
 <header class="app-topbar">
  <div class="d-flex align-items-center gap-3"><button class="btn btn-ghost btn-icon menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Открыть меню"><i class="bi bi-list" aria-hidden="true"></i></button><nav aria-label="Хлебные крошки"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/dashboard}" aria-label="Моя страница"><i class="bi bi-house-door" aria-hidden="true"></i></a></li><li class="breadcrumb-item active" aria-current="page" id="currentBreadcrumb">Рабочее пространство</li></ol></nav></div>
  <div class="topbar-actions"><form class="topbar-search search-field" method="get" th:action="@{/tasks}" role="search"><i class="bi bi-search" aria-hidden="true"></i><input class="form-control" type="search" name="q" placeholder="Поиск задач" aria-label="Поиск по всем задачам"></form><div class="dropdown"><button class="account-button" data-bs-toggle="dropdown" type="button" aria-label="Меню аккаунта" aria-expanded="false"><span class="avatar"><i class="bi bi-person" aria-hidden="true"></i></span></button><div class="dropdown-menu dropdown-menu-end"><div class="px-3 py-2"><strong sec:authentication="name"></strong><div class="small text-secondary">Virtual Enterprise</div></div><hr class="dropdown-divider"><form th:action="@{/logout}" method="post"><button class="dropdown-item"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Выйти из аккаунта</button></form></div></div></div>
 </header>
</div>
<div th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></div>
</body></html>
