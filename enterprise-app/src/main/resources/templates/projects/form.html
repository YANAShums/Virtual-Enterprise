<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Новый проект')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="mainContent" tabindex="-1" class="container form-page"><div class="mb-4"><a th:href="@{/projects}" class="text-decoration-none"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>К проектам</a><h1 class="h3 mt-4 mb-4">Создание проекта</h1></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/projects}" th:object="${projectForm}" method="post" class="row g-3"><div class="col-12" th:if="${#fields.hasAnyErrors()}"><div class="alert alert-danger" role="alert"><strong>Проверьте заполнение формы</strong><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div></div>
<div class="col-md-3"><label class="form-label" for="code">Код *</label><input id="code" th:field="*{code}" class="form-control text-uppercase" required></div><div class="col-md-9"><label class="form-label" for="name">Название *</label><input id="name" th:field="*{name}" class="form-control" required></div>
<div class="col-12"><label class="form-label" for="description">Описание</label><textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea></div>
<div class="col-md-4"><label class="form-label" for="managerId">Руководитель *</label><select id="managerId" th:field="*{managerId}" class="form-select" required><option value="">Выберите</option><option th:each="x:${employees}" th:value="${x.id}" th:text="${x.fullName}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="plannedStartDate">Начало *</label><input id="plannedStartDate" th:field="*{plannedStartDate}" type="date" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="plannedEndDate">Окончание *</label><input id="plannedEndDate" th:field="*{plannedEndDate}" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label" for="plannedHours">Плановые часы</label><input id="plannedHours" th:field="*{plannedHours}" type="number" min="0" step="1" class="form-control"></div><div class="col-md-4"><label class="form-label" for="priority">Приоритет</label><select id="priority" th:field="*{priority}" class="form-select"><option value="LOW">Низкий</option><option value="MEDIUM">Средний</option><option value="HIGH">Высокий</option><option value="CRITICAL">Критический</option></select></div>
<div class="col-12"><label class="form-label" for="memberIds">Команда проекта</label><div class="search-field mb-2"><i class="bi bi-search" aria-hidden="true"></i><input type="search" class="form-control" data-filter-target=".team-choice" placeholder="Найти сотрудника" aria-label="Поиск участника команды"></div><div class="team-choices" id="memberIds"><label class="team-choice" th:each="x:${employees}"><input type="checkbox" class="form-check-input m-0" th:field="*{memberIds}" th:value="${x.id}"><span><span th:text="${x.fullName}"></span><small class="d-block text-secondary" th:text="${x.position.name}"></small></span></label></div><div class="form-text">Руководитель добавляется в команду автоматически.</div></div>
<div class="col-12 form-actions"><button class="btn btn-primary">Создать проект</button><a th:href="@{/projects}" class="btn btn-outline-secondary ms-2">Отмена</a></div></form></div></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
