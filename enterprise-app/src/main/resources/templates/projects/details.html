<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Обзор проекта')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main id="mainContent" class="container-fluid">
 <a class="eyebrow d-inline-block mb-3" th:href="@{/projects}">Проекты <i data-lucide="chevron-right" class="mx-1" aria-hidden="true"></i><span th:text="${project.code}"></span></a>
 <div class="page-heading"><div class="heading-title"><span class="project-mark"><i data-lucide="folder" class="" aria-hidden="true"></i></span><h1 th:text="${project.name}"></h1><span th:replace="~{fragments/ui :: projectStatus(${project.status})}"></span></div></div>
 <nav class="view-tabs" aria-label="Разделы проекта"><a class="active" th:href="@{/projects/{id}(id=${project.id})}" aria-current="page">О проекте</a><a th:href="@{/tasks(projectId=${project.id})}">Задачи <span class="text-secondary ms-1" th:text="${#lists.size(tasks)}"></span></a><a th:href="@{/kanban(projectId=${project.id})}">Доска</a></nav>
 <div class="detail-layout"><div class="detail-content">
  <section class="detail-section"><h2>Описание</h2><p class="description-text" th:text="${!#strings.isEmpty(project.description) ? project.description : 'Описание пока не добавлено.'}"></p></section>
  <section class="detail-section"><div class="widget-heading"><h2>Задачи проекта</h2><a th:href="@{/tasks(projectId=${project.id})}">Открыть список</a></div><div th:replace="~{fragments/tasks :: table(${tasks})}"></div></section>
  <section class="detail-section"><h2>Команда <span class="text-secondary ms-1" th:text="${#lists.size(members)}"></span></h2><div class="member-row" th:each="member:${members}"><span class="avatar" th:text="${#strings.substring(member.employee.firstName,0,1)+#strings.substring(member.employee.lastName,0,1)}"></span><div><a th:href="@{/employees/{id}(id=${member.employee.id})}" th:text="${member.employee.fullName}"></a><div class="small text-secondary" th:text="${member.employee.position.name+' · '+member.employee.department.name}"></div></div></div><p th:if="${#lists.isEmpty(members)}" class="text-secondary">Участники ещё не добавлены.</p></section>
 </div><aside class="property-panel"><h2>Параметры проекта</h2><dl class="property-list">
  <dt>Статус</dt><dd><span th:replace="~{fragments/ui :: projectStatus(${project.status})}"></span></dd><dt>Руководитель</dt><dd th:text="${project.manager != null ? project.manager.fullName : 'Не назначен'}"></dd>
  <dt>Начало</dt><dd th:text="${#temporals.format(project.plannedStartDate,'dd.MM.yyyy')}"></dd><dt>Дедлайн</dt><dd th:text="${#temporals.format(project.plannedEndDate,'dd.MM.yyyy')}"></dd><dt>Приоритет</dt><dd><span th:replace="~{fragments/ui :: priority(${project.priority})}"></span></dd><dt>Риск</dt><dd><span th:replace="~{fragments/ui :: risk(${project.riskLevel})}"></span></dd><dt>План, ч</dt><dd th:text="${project.plannedHours ?: 0}"></dd><dt>Затрачено, ч</dt><dd th:text="${actualHours}"></dd><dt>Выполнено</dt><dd><span th:text="${project.progressPercent+'%'}"></span><div class="progress mt-2"><div class="progress-bar" th:style="${'width:'+project.progressPercent+'%'}"></div></div></dd>
 </dl></aside></div>
</main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
