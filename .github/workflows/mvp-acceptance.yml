name: MVP acceptance (isolated)
on:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: attrition-ml-service/requirements-dev.txt
      - run: pip install -r attrition-ml-service/requirements-dev.txt
      - name: Run isolated acceptance
        shell: pwsh
        run: ./tools/run-mvp-acceptance.ps1
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-acceptance-results
          path: |
            output/improvement-stage*.json
            output/ml-acceptance/*results.json
